  <style>
    /* 連結頁專用樣式 */
    :root {
      --navy-900: #021226;
      --navy-800: #0A2647;
      --navy-700: #144272;
      --navy-100: #E6F0F9;
      --gold-500: #CBA16E;
      --gold-400: #DCC09B;
      --gold-100: #F9F3EB;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --bg-body: #F8FAFC;
      --bg-white: #FAFAFA;
      --ease-custom: cubic-bezier(0.19, 1, 0.22, 1);
    }

    
    /* 連結頁容器 */
    .links-page {
      min-height: calc(100vh - var(--header-h, 80px));
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(48px, 8vw, 96px) clamp(20px, 5%, 40px) 80px;
    }

    
    /* 頁首區 */
    .links-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .links-header .site-avatar {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border: 2px solid var(--navy-900);
      margin-bottom: 16px;
    }

    .links-header h1 {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: clamp(1.35rem, 3vw, 1.75rem);
      font-weight: 900;
      color: var(--navy-900);
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }

    .links-header .subtitle {
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--gold-500);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0;
    }

    .links-divider {
      width: 60px;
      height: 4px;
      background: var(--gold-500);
      margin: 16px auto 0;
    }

    
    /* 連結列表 */
    .links-list {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    
    .links-group-label {
      font-family: 'Outfit', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 20px 0 4px;
      padding-left: 4px;
    }

    .links-group-label:first-child {
      margin-top: 0;
    }

    
    /* 連結卡片 */
    .lk-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 22px;
      border: 2px solid var(--navy-900);
      background: var(--bg-white);
      color: var(--navy-900);
      text-decoration: none;
      font-family: 'Noto Sans TC', sans-serif;
      position: relative;
      transition: transform 0.25s var(--ease-custom), box-shadow 0.25s, background 0.2s;
    }

    .lk-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--gold-500);
    }

    .lk-card:hover {
      transform: translate(-4px, -4px);
      box-shadow: 6px 6px 0 var(--navy-900);
      background: var(--navy-100);
      text-shadow: none !important;
    }

    .lk-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-800);
    }

    .lk-icon svg {
      width: 24px;
      height: 24px;
    }

    .lk-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .lk-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy-900);
      letter-spacing: 0.3px;
    }

    .lk-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.4;
    }

    .lk-arrow {
      font-family: 'Outfit', sans-serif;
      color: var(--gold-500);
      font-size: 18px;
      flex-shrink: 0;
    }

    
    .back-home {
      margin-top: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .back-home:hover {
      color: var(--navy-900);
      border-color: var(--gold-500);
      text-shadow: none !important;
    }
  </style>
